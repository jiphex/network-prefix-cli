name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.0.1"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN: prefixtool

permissions:
  contents: read

jobs:
  # Fail before spending six build jobs on a tag that disagrees with the
  # manifest, which would otherwise ship binaries whose --version is wrong.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $tag implies version $version, but Cargo.toml says $manifest"
            exit 1
          fi
          # A 0.x version is pre-production by semver's own definition, and
          # a suffixed version (1.0.0-rc1) says so outright. Either marks the
          # release as a prerelease so it does not show as "latest".
          case "$version" in
            0.*|*-*) prerelease=true ;;
            *)       prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (prerelease=$prerelease)"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # libc6-dev-arm64-cross carries the glibc startup objects
            # (Scrt1.o, crti.o) that the cross gcc links against. It is only
            # a Recommends of gcc-aarch64-linux-gnu, so --no-install-recommends
            # leaves it out and the link fails.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install cross-compilation packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.packages }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Select cross linker
        if: matrix.linker != ''
        run: |
          target=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # arm64 macOS refuses to execute a Mach-O whose signature does not match
      # its contents, and the release profile strips symbols after the linker
      # has ad-hoc signed. Re-sign, then assert the signature is intact rather
      # than trusting that it is - a broken one surfaces as an unexplained
      # "killed: 9" on the user's machine, not as a build failure here.
      - name: Ad-hoc code signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/$BIN"
          codesign --force --sign - --timestamp=none "$bin"
          codesign --verify --strict --verbose=2 "$bin"

      - name: Smoke test
        # Only the natively-runnable targets; the cross-built ones are just
        # checked for existence in the packaging step.
        if: matrix.linker == '' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/$BIN"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="$bin.exe"
          fi
          "$bin" --version
          "$bin" 2001:db8::/52 -56 -64x2

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="$BIN-${{ needs.verify.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "staging/$name" dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "staging/$name/"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "staging/$name/"
          fi
          cp README.md LICENSE "staging/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name") > /dev/null
          else
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi
          # sha256sum on Linux and Git Bash, shasum on macOS.
          cd dist
          for f in *; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deliberately does not check out the repository. Everything this job
    # needs is either an artifact or a workflow expression, and checking out
    # the tag made publishing fail if the tag moved or was deleted while the
    # six build jobs were still running.
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          {
            if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then
              echo "> **Pre-production release.** Published for testing; the interface may still change."
              echo
            fi
            echo "\`prefixtool\` ${{ needs.verify.outputs.version }} - inspect, split and carve up IPv4 and IPv6 prefixes."
            echo
            echo '```'
            echo 'prefixtool 2001:db8::/52 -56 -64x2'
            echo '```'
            echo
            echo "## Install"
            echo
            echo "Download the archive for your platform below, unpack it, and put \`prefixtool\` on your \`PATH\`. Each archive ships with a \`.sha256\` alongside it:"
            echo
            echo '```'
            echo 'sha256sum -c prefixtool-${{ needs.verify.outputs.tag }}-<target>.tar.gz.sha256'
            echo '```'
            echo
            echo "### macOS"
            echo
            echo "These binaries are ad-hoc signed but not notarized, so Gatekeeper will object to one that arrives with a quarantine flag. Unpacking from Terminal never sets that flag, so this just works:"
            echo
            echo '```'
            echo 'tar xzf prefixtool-${{ needs.verify.outputs.tag }}-<target>.tar.gz'
            echo './prefixtool --version'
            echo '```'
            echo
            echo "If you downloaded through a browser and hit \"Apple could not verify...\", clear the flag it added:"
            echo
            echo '```'
            echo 'xattr -d com.apple.quarantine prefixtool'
            echo '```'
            echo
            echo "Or build it yourself:"
            echo
            echo '```'
            echo 'cargo install --git ${{ github.server_url }}/${{ github.repository }} --tag ${{ needs.verify.outputs.tag }}'
            echo '```'
            echo
            echo "## Binaries"
            echo
            for f in dist/*.tar.gz dist/*.zip; do
              [ -e "$f" ] || continue
              echo "- \`$(basename "$f")\`"
            done
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Without a checkout there is no git remote for gh to infer from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRE: ${{ needs.verify.outputs.prerelease }}
          # Anchors the release to the commit this run actually built. Ignored
          # when the tag still exists, and recreates it at the right commit if
          # it does not.
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Idempotent, so re-running the workflow for a tag refreshes assets
          # instead of failing on an existing release. --prerelease is passed
          # explicitly either way, so a re-run also corrects the flag.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --prerelease="$PRE"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --target "$TARGET" --title "$TAG" \
              --notes-file notes.md --prerelease="$PRE" dist/*
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '"published \(.tagName) prerelease=\(.isPrerelease) assets=\(.assets|length)"' 
